services:
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Le fichier .keras (23 Mo) n'est pas dans l'image ni dans Git : il se
      # récupère sur le Drive partagé et se dépose dans ./models.
      - ./models:/app/models:ro
    environment:
      - AGRIVISION_MODELE=/app/models/mobilenetv2_v1.keras
    healthcheck:
      # Le service met une dizaine de secondes à charger le modèle au
      # démarrage ; sans start_period, l'application le croirait mort.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: src/app/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
